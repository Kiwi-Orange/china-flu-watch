name: Update respiratory surveillance data

on:
  schedule:
    # 两个全国源均每周四发布（北京时间），周五凌晨抓一次，周六上午补抓一次
    - cron: '41 17 * * 4'   # 周四 17:41 UTC = 周五 01:41 北京时间
    - cron: '41 1 * * 6'    # 周六 01:41 UTC = 周六 09:41 北京时间（补抓迟发）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pdftotext (poppler)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch surveillance data
        run: python fetch.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "Update surveillance data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
